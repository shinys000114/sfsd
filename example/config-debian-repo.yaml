# Debian APT repository serving configuration
# This serves an already-generated repository tree, for example:
#   /srv/apt-repo/dists/...
#   /srv/apt-repo/pool/...
#
# Repository metadata generation/signing should be handled by tools such as
# aptly, reprepro, apt-ftparchive, or dpkg-scanpackages.

apt_repo:
  server:
    host: "0.0.0.0"
    port: 8080
  directory:
    path: "/srv/apt-repo"
    allow_symlink: true
    allow_external_symlink: false
    hide_hidden: true
    render_readme_md: false
    exclude:
      - .git/
      - '*.tmp'
      - incoming/
  features:
    # Debian repository metadata is commonly pre-compressed as Packages.gz,
    # Packages.xz, etc. Keep dynamic compression disabled unless you know
    # your clients/proxies need it.
    compression:
      - none
    stats_file: "data/stats-apt-repo.json"
    cache_rules:
      # Release metadata should be revalidated frequently to avoid stale
      # package indexes on clients.
      - pattern: 'dists/**/InRelease'
        max_age: 0
      - pattern: 'dists/**/Release'
        max_age: 0
      - pattern: 'dists/**/Release.gpg'
        max_age: 0
      - pattern: 'dists/**/Packages*'
        max_age: 300
      - pattern: 'dists/**/Sources*'
        max_age: 300

      # Package files are content-addressed by repository metadata hashes in
      # normal APT workflows, so long caching is usually safe.
      - pattern: 'pool/**/*.deb'
        max_age: 31536000
      - pattern: '*'
        max_age: 3600
  logging:
    format: plain
    access_log: "access-apt-repo.log"
    error_log: "error-apt-repo.log"
