# Scenario: End-to-End TLS (Proxy to HTTPS Backend)
# Front-end (HTTPS) -> Nginx -> Back-end (HTTPS 127.0.0.1:8443)
server {
    listen 443 ssl;
    server_name full-secure.com;

    ssl_certificate /path/to/proxy-cert.pem;
    ssl_certificate_key /path/to/proxy-key.pem;

    location / {
        # Proxying to sfsd's HTTPS port
        proxy_pass https://127.0.0.1:8443;
        # Use if sfsd has a self-signed cert for internal comms
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}
