# Scenario: vHost Support (Single backend, multiple domains)
# Multiple domains pointing to one sfsd instance (Port 8080).
# sfsd must have 'domains' configured in config.yaml.
server {
    listen 443 ssl;
    server_name vhost-a.com vhost-b.com;

    ssl_certificate /path/to/combined.pem;
    ssl_certificate_key /path/to/combined.key;

    location / {
        proxy_pass http://127.0.0.1:8080;
        # CRITICAL: Preserve Host header so sfsd can distinguish domains.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
