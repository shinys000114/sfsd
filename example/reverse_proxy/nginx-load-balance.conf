# Scenario: Load Balancing (Multiple sfsd instances)
# Distribute traffic across several sfsd instances/ports.
upstream sfsd_cluster {
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
    # Optional: Keepalive for better performance
    keepalive 32;
}

server {
    listen 80;
    server_name cluster.example.com;

    location / {
        proxy_pass http://sfsd_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
