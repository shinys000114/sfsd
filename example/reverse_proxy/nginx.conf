# sfsd Nginx Reverse Proxy Examples (HTTP/3 & VHost Support)
#
# This configuration covers various scenarios for proxying to sfsd backends.
# Nginx handles SSL termination, caching, and load balancing.

# Upstream definition for load balancing scenario
upstream sfsd_backend {
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
    keepalive 32;
}

# --- SCENARIO 1: Standard SSL Termination + HTTP/3 (QUIC) ---
# Front-end (HTTPS/HTTP3) -> Nginx -> Back-end (HTTP 127.0.0.1:8080)
# This is the most common setup.
server {
    listen 443 ssl http2;
    listen 443 quic reuseport;
    listen [::]:443 ssl http2;
    listen [::]:443 quic reuseport;
    server_name simple.example.com;

    # SSL certificate paths
    ssl_certificate /etc/letsencrypt/live/simple.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simple.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Inform browsers about HTTP/3 availability
    add_header Alt-Svc 'h3=":443"; ma=86400';

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- SCENARIO 2: vHost Support (Single backend, multiple domains) ---
# Multiple domains pointing to one sfsd instance (Port 8080).
# sfsd must have 'domains' configured in config.yaml.
server {
    listen 443 ssl;
    server_name vhost-a.com vhost-b.com;

    ssl_certificate /path/to/combined.pem;
    ssl_certificate_key /path/to/combined.key;

    location / {
        proxy_pass http://127.0.0.1:8080;
        # CRITICAL: Preserve Host header so sfsd knows which domain was requested.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# --- SCENARIO 3: End-to-End TLS (Proxy to HTTPS Backend) ---
# When sfsd is also configured with TLS.
server {
    listen 443 ssl;
    server_name full-secure.com;

    ssl_certificate /path/to/proxy-cert.pem;
    ssl_certificate_key /path/to/proxy-key.pem;

    location / {
        proxy_pass https://127.0.0.1:8443; # Proxying to sfsd HTTPS port
        proxy_ssl_verify off; # If sfsd uses a self-signed cert for internal comms
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}

# --- SCENARIO 4: Load Balancing (Multiple sfsd instances) ---
# Distribute traffic across several sfsd instances.
server {
    listen 80;
    server_name cluster.example.com;

    location / {
        proxy_pass http://sfsd_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
