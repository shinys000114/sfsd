# sfsd Nginx Reverse Proxy Example
#
# This configuration handles HTTPS connections (SSL Offloading) via Nginx,
# and forwards the actual file serving requests to the backend sfsd (default port 8080).

server {
    listen 80;
    listen [::]:80;
    server_name files.example.com;

    # Redirect HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name files.example.com;

    # SSL certificate paths (when using Let's Encrypt / Certbot, etc.)
    ssl_certificate /etc/letsencrypt/live/files.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;

    # Since sfsd already supports compression, you can disable compression in Nginx.
    # (Alternatively, empty the compression list in sfsd's config.yaml and enable it here)
    gzip off;

    # Extend timeout and buffer settings for large file downloads (Optional)
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;

    location / {
        # Backend sfsd address (must match host/port in config.yaml)
        proxy_pass http://127.0.0.1:8080;

        # Forward headers so sfsd knows the client's real IP and protocol
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Settings in case WebSocket-using features are added later
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}