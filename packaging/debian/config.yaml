# Default packaged sfsd configuration.
#
# Edit this file for production use:
#   /etc/sfsd/config.yaml
default:
  server:
    host: "127.0.0.1"
    port: 8080
  directory:
    path: "/var/lib/sfsd/public"
    allow_symlink: true
    allow_external_symlink: false
    hide_hidden: true
    render_readme_md: true
    exclude:
      - .git/
      - '*.tmp'
      - '*.old'
  features:
    compression:
      - gzip
      - brotli
    stats_file: "/var/lib/sfsd/data/stats.json"
  logging:
    format: plain
